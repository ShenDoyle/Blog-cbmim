name: Notion 同步并发布

# 触发方式
#   1) 推送：任何推送到 main 的源码改动（改主题、改封面脚本、改配置、图片入库）→ 立即构建上线
#   2) 手动：仓库 Actions 页面点 “Run workflow”，手机上也能点（强制走一遍构建发布）
#   3) 定时：每 6 小时（GitHub 用 UTC，00/06/12/18 点 = 北京 08/14/20/02 点）
#            只在「Notion 内容有变化」时才构建发布，避免空跑
#
# 防环：同步会把文章回写成 bot 提交并推回 main，
#       该 push 由 bot 触发 → job 级 if 直接跳过，不会无限自我触发。
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只预览同步结果，不写文件、不发布
        type: boolean
        default: false
      force:
        description: 忽略增量，所有 Notion 文章重新生成
        type: boolean
        default: false

# 需要写回源码仓（提交生成的文章与图片）
permissions:
  contents: write

# 避免两次运行同时改同一批文件
concurrency:
  group: notion-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 拉取 Notion → 构建 → 发布
    # 固定 24.04 而不是 ubuntu-latest：
    # ubuntu-latest 会在 2026-10-20 迁移到 Ubuntu 26，构建环境会静默变化
    # （Node/Python/OpenSSL 版本都可能动），固定版本保证「今天能构建 = 明天还能构建」。
    # 需要升级时只改这一行，然后手动 Run workflow 做一次回归。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 同步回写产生的 bot 提交不再触发第二次运行（防止 push 触发成环）
    if: github.actor != 'github-actions[bot]'

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TZ: Asia/Shanghai

    steps:
      # actions/* 用主版本标签（@vN）而不是钉死补丁号：
      # 这样能自动收到安全更新，大版本升级由人工控制。
      # v5+ 起 action 本身运行在 Node 24 上（Node 20 已废弃）。
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          npm ci --no-audit --no-fund

      - name: 配置 git 身份
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 凭据预检（缺 Secret 立刻失败，避免报难懂的 API 错误）
        run: |
          fail=0
          [ -n "$NOTION_TOKEN" ]       || { echo "::error::缺少 secret：NOTION_TOKEN"; fail=1; }
          [ -n "$NOTION_DATABASE_ID" ] || { echo "::error::缺少 secret：NOTION_DATABASE_ID"; fail=1; }
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            [ -n "${{ secrets.DEPLOY_KEY }}" ] || { echo "::error::缺少 secret：DEPLOY_KEY（ShenDoyle.github.io 的可写部署密钥）"; fail=1; }
          fi
          exit $fail

      - name: 离线自检（转换规则回归）
        run: npm run notion:selftest

      - name: 同步 Notion
        id: sync
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "▶ 预览模式"
            npm run notion:sync -- --dry-run --verbose
            npm run notion:pages -- --dry-run --verbose
          elif [ "${{ inputs.force }}" = "true" ]; then
            echo "▶ 全量重建"
            npm run notion:sync -- --force --prune-assets
            npm run notion:pages -- --force
          else
            echo "▶ 增量同步"
            npm run notion:sync -- --prune-assets
            npm run notion:pages
          fi

      - name: 同步站点设置（Notion「⚙️ 站点设置」→ source/_data/site-settings.yml）
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run notion:settings -- --dry-run --verbose
          else
            npm run notion:settings
          fi

      - name: 把生成的文章与图片提交回源码仓
        if: ${{ inputs.dry_run != true }}
        run: |
          git add -A source .notion-sync-state.json .notion-pages-state.json
          if git diff --cached --quiet; then
            echo "内容无变化"
            echo "CONTENT_CHANGED=0" >> "$GITHUB_ENV"
          else
            git commit -m "chore(notion): 同步 Notion 文章 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 本地可能在此期间推过新提交（如手改 README），rebase 兜底避免 push 被拒
            git pull --rebase origin main
            git push
            echo "CONTENT_CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: 判断是否需要构建发布
        if: ${{ inputs.dry_run != true }}
        run: |
          # push / 手动触发都强制构建发布；定时触发只在内容变化时构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发 → 强制走一遍构建发布"
            echo "NEED_DEPLOY=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "推送触发 → 构建并发布"
            echo "NEED_DEPLOY=1" >> "$GITHUB_ENV"
          elif [ "${CONTENT_CHANGED:-0}" = "1" ]; then
            echo "定时触发且内容有变化 → 构建并发布"
            echo "NEED_DEPLOY=1" >> "$GITHUB_ENV"
          else
            echo "定时触发且内容未变化 → 跳过构建与发布"
            echo "NEED_DEPLOY=0" >> "$GITHUB_ENV"
          fi

      - name: 构建站点
        if: env.NEED_DEPLOY == '1'
        run: |
          npx hexo clean
          # 豆瓣 / 追番要联网抓取，偶发失败时重试一次
          npx hexo generate || {
            echo "首次构建失败，60 秒后重试（多为豆瓣/追番抓取超时）"
            sleep 60
            npx hexo clean
            npx hexo generate
          }
          echo "产物文件数：$(find public -type f | wc -l)"

      - name: 发布前预检（部署密钥与产物仓可写性）
        if: env.NEED_DEPLOY == '1'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "密钥类型：$(head -1 ~/.ssh/deploy_key)"
          echo "密钥指纹（sha256，可用于比对是否配对）：$(sha256sum ~/.ssh/deploy_key | cut -c1-16)"
          # accept-new：首次连接自动记录主机指纹，避免 keyscan 失败导致 ssh 直接拒绝
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "--- ssh 认证探测 ---"
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new git@github.com 2>&1 || true

      - name: 发布到 GitHub Pages 仓库
        if: env.NEED_DEPLOY == '1'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "缺少 secret：DEPLOY_KEY（ShenDoyle.github.io 的可写部署密钥）"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          if ! npx hexo deploy; then
            echo "::group::部署失败诊断"
            if [ -d .deploy_git ]; then
              git -C .deploy_git remote -v
              git -C .deploy_git log --oneline -3
              git -C .deploy_git status --short | head -20
            else
              echo ".deploy_git 不存在（hexo-deployer-git 首次 clone 阶段就失败了）"
            fi
            echo "::endgroup::"
            exit 1
          fi
          echo "产物仓最新提交：$(git ls-remote git@github.com:ShenDoyle/ShenDoyle.github.io.git refs/heads/main | cut -c1-7)"

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | ${{ github.event_name }}（${{ github.actor }}） |"
            echo "| 内容有变化 | ${CONTENT_CHANGED:-0} |"
            echo "| 已执行发布 | ${NEED_DEPLOY:-0} |"
            echo "| 预览模式 | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
